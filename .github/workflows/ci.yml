name: CI

on:
  push:
    branches: ["main", "claude/**", "[0-9][0-9][0-9]-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # esbuild's postinstall fetches a platform binary; tsup needs it.
  PNPM_VERSION: "10.33.0"

jobs:
  verify:
    name: Typecheck · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.11", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The probe script needs a live relaxAI key, which CI has none of. It is
      # still verified: a stub impersonates four models with deliberately awkward
      # behaviour and the self-test asserts the probe's conclusions about each.
      # Needs Node >= 22.6 for --experimental-strip-types.
      - name: Probe script self-test
        if: matrix.node == '22'
        run: pnpm probe:selftest

      - name: Assert published entry points exist
        run: |
          for pkg in protocol contract theme-base render core react next; do
            for f in dist/index.js dist/index.cjs dist/index.d.ts; do
              test -f "packages/$pkg/$f" || { echo "missing packages/$pkg/$f"; exit 1; }
            done
          done
          # The element is ESM only: a browser module with a side-effect entry.
          for f in dist/index.js dist/index.d.ts dist/define.js dist/define.d.ts; do
            test -f "packages/element/$f" || { echo "missing packages/element/$f"; exit 1; }
          done

      # Core takes no runtime dependency (NFR-203), so it compiles protocol in
      # rather than importing it. A build that imports it would install fine in
      # this workspace and break for anyone installing core alone.
      - name: "V — core's and render's builds do not import workspace packages"
        run: |
          # Both compile in what they use (protocol; core also contract), so
          # neither takes a runtime dependency (NFR-203, T-260).
          if grep -nE 'relax-ui-(protocol|contract)' packages/core/dist/index.js packages/core/dist/index.cjs packages/core/dist/index.d.ts                packages/render/dist/index.js packages/render/dist/index.cjs packages/render/dist/index.d.ts; then
            echo "::error::a build refers to a workspace package it must bundle in (NFR-203)."
            exit 1
          fi
          # The element compiles in protocol, render and theme-base; only the
          # contract (and Zod) stay outside, loaded when a document is validated.
          if grep -nE 'relax-ui-(protocol|render|theme-base)' packages/element/dist/*.js packages/element/dist/*.d.ts; then
            echo "::error::relax-ui-element's build refers to a package it must bundle in (T-260)."
            exit 1
          fi

  constitution:
    name: Constitutional invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each check below enforces a principle from .specify/memory/constitution.md.
      # They are greps rather than prose because a principle nobody can verify is
      # a principle that decays.

      - name: "V — core imports no node: module"
        run: |
          if grep -rn 'from "node:' packages/protocol/src packages/core/src packages/react/src packages/render/src packages/contract/src packages/theme-base/src packages/element/src; then
            echo "::error::A node: import breaks Edge and Workers compatibility (Principle V)."
            exit 1
          fi

      - name: "V — protocol, theme-base and render have no runtime dependencies"
        run: |
          # Not even a peer: every host loads them, so whatever they declare
          # every host inherits (NFR-202).
          for pkg in protocol theme-base render; do
            PKG="$pkg" node -e '
              const p = require("./packages/" + process.env.PKG + "/package.json");
              const bad = ["dependencies", "peerDependencies", "optionalDependencies"]
                .filter((k) => p[k] && Object.keys(p[k]).length);
              if (bad.length) {
                console.log("::error::Principle V: " + p.name + " declares " + bad.join(", "));
                process.exit(1);
              }
              console.log(p.name + " has no runtime dependencies");
            '
          done

      - name: "V — the element has no dependencies; the contract and Zod are optional peers"
        run: |
          # The validator is the application's choice and loads only for full
          # validation, so a page using validate="server" installs and ships
          # neither (FR-208).
          node -e '
            const p = require("./packages/element/package.json");
            const deps = Object.keys(p.dependencies ?? {});
            const peers = Object.keys(p.peerDependencies ?? {}).sort().join();
            const optional = Object.keys(p.peerDependencies ?? {}).every((k) => p.peerDependenciesMeta?.[k]?.optional === true);
            if (deps.length || (peers !== "" && peers !== "relax-ui-contract,zod") || !optional) {
              console.log("::error::relax-ui-element may declare only relax-ui-contract and zod, as optional peers.");
              process.exit(1);
            }
            console.log("relax-ui-element: no dependencies; optional peers " + peers);
          '

      - name: "V — contract depends only on protocol, with Zod as its peer"
        run: |
          node -e '
            const p = require("./packages/contract/package.json");
            const deps = Object.keys(p.dependencies ?? {}).join();
            const peers = Object.keys(p.peerDependencies ?? {}).join();
            if (deps !== "relax-ui-protocol" || peers !== "zod") {
              console.log("::error::relax-ui-contract may depend only on relax-ui-protocol, with zod as a peer.");
              process.exit(1);
            }
            console.log("relax-ui-contract: relax-ui-protocol, zod as peer");
          '

      - name: "V — core has no runtime dependencies"
        run: |
          if node -e 'const p=require("./packages/core/package.json"); process.exit(p.dependencies && Object.keys(p.dependencies).length ? 1 : 0)'; then
            echo "core has no runtime dependencies"
          else
            echo "::error::Principle V: core must have zero runtime dependencies (Zod is a peer)."
            exit 1
          fi

      - name: "IV — no raw-HTML sink anywhere"
        run: |
          # Matches real usage (an assignment or a JSX prop), not the comments that
          # explain why the sink is absent.
          hits=$(grep -rnE 'dangerouslySetInnerHTML[[:space:]]*[:=]|\.innerHTML[[:space:]]*=|insertAdjacentHTML' \
                 packages examples --include='*.ts' --include='*.tsx' \
                 | grep -v '/dist/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Principle IV: model output must never reach a raw-HTML sink."
            exit 1
          fi

      - name: "IV — the depth guard must not be recursive"
        run: |
          # measureTree walks a model-supplied tree. A recursive walk overflows the
          # stack while measuring, i.e. the guard fails before it can fire.
          if ! grep -q 'const stack:' packages/protocol/src/ui.ts; then
            echo "::error::measureTree must use an explicit stack (Principle IV)."
            exit 1
          fi

      - name: "I — the SDK contacts no host but the configured endpoint"
        run: |
          # Any absolute URL in core outside the sovereignty default is suspicious:
          # the SDK must make no network call the application did not ask for.
          # `relative.invalid` is the placeholder base the protocol's same-origin
          # check resolves against when there is no page; `.invalid` is reserved
          # (RFC 2606) and nothing is ever fetched from it.
          # `www.w3.org` is the SVG namespace name: an identifier, never fetched.
          hits=$(grep -rnoE 'https?://[a-zA-Z0-9.-]+' packages/core/src packages/protocol/src \
                 packages/render/src packages/element/src packages/theme-base/src packages/contract/src \
                 | grep -vE 'api\.relax\.ai|json-schema\.org|localhost|127\.0\.0\.1|relative\.invalid|www\.w3\.org' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Principle I: no SDK-initiated egress beyond the configured relaxAI endpoint."
            exit 1
          fi

      - name: "VI — every feature has its Spec Kit chain"
        run: |
          test -f .specify/memory/constitution.md || { echo "::error::missing constitution"; exit 1; }
          for d in specs/*/; do
            for f in spec.md plan.md tasks.md research.md data-model.md; do
              test -f "$d$f" || { echo "::error::$d is missing $f (Principle VI)."; exit 1; }
            done
          done

      - name: "VI — no unresolved clarification markers"
        run: |
          if grep -rn 'NEEDS CLARIFICATION' specs/ --include='*.md' | grep -v 'template\|marker\|Mark every ambiguity\|no markers remain\|rather than guessing'; then
            echo "::error::Principle VI: resolve every [NEEDS CLARIFICATION] before planning."
            exit 1
          fi

  e2e:
    name: Browser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The workspace packages are consumed by the example through `workspace:`
      # links, so the example cannot start until they are built.
      - name: Build packages
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Drives the reference app in a real browser against a local stand-in
      # endpoint: the route's frames reach the hook, the hook's patches reach the
      # renderer, and a failed generation says what failed. No relaxAI account and
      # no model involved — the stand-in makes the document deterministic.
      - name: Browser tests
        run: pnpm test:e2e

      # <gen-ui> in a plain HTML page under script-src 'self' (T-248): the base
      # theme, Bootstrap 5 and Shoelace through connectors, four elements on one
      # page with no style crossing a shadow boundary (T-247).
      - name: Browser tests (plain HTML host)
        run: pnpm --filter relax-ui-example-html test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            examples/next-app/playwright-report/
            examples/html-host/test-results/
          retention-days: 7

  size:
    name: Size report
    runs-on: ubuntu-latest
    # Reported, never enforced (NFR-201): a size change must not block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # The last main build's report. A pull request may read caches saved on
      # its base branch, so a PR compares against main; main against itself.
      - name: Restore previous report
        uses: actions/cache/restore@v4
        with:
          path: .size/previous.json
          key: size-report-main-${{ github.sha }}
          restore-keys: size-report-main-

      - name: Measure
        run: node scripts/size-report.mjs --out .size/current.json --previous .size/previous.json

      - name: Keep this report for the next comparison
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp .size/current.json .size/previous.json

      - name: Save report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .size/previous.json
          key: size-report-main-${{ github.sha }}

  diagrams:
    name: Mermaid diagrams render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Installed OUTSIDE the repository on purpose. `npm` cannot read this
      # workspace's root package.json — it uses pnpm's `workspace:` protocol —
      # and a diagram check has no business touching the project's dependency
      # graph either way.
      - name: Install mermaid-cli (out of tree)
        run: |
          mkdir -p "$RUNNER_TEMP/mermaid-tools"
          cd "$RUNNER_TEMP/mermaid-tools"
          npm init -y >/dev/null
          npm i --no-fund --no-audit @mermaid-js/mermaid-cli@11
          echo "MMDC=$RUNNER_TEMP/mermaid-tools/node_modules/.bin/mmdc" >> "$GITHUB_ENV"

      # A diagram that does not render is worse than no diagram: it looks like
      # documentation and conveys nothing. Two of these were syntactically wrong
      # when first written and looked entirely plausible in the source.
      - name: Render every fenced mermaid block
        run: node scripts/check-diagrams.mjs
