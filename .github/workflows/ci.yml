name: CI

on:
  push:
    branches: ["main", "claude/**", "[0-9][0-9][0-9]-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # esbuild's postinstall fetches a platform binary; tsup needs it.
  PNPM_VERSION: "10.33.0"

jobs:
  verify:
    name: Typecheck · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.11", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The probe script needs a live relaxAI key, which CI has none of. It is
      # still verified: a stub impersonates four models with deliberately awkward
      # behaviour and the self-test asserts the probe's conclusions about each.
      # Needs Node >= 22.6 for --experimental-strip-types.
      - name: Probe script self-test
        if: matrix.node == '22'
        run: pnpm probe:selftest

      - name: Assert published entry points exist
        run: |
          for pkg in core react next; do
            for f in dist/index.js dist/index.cjs dist/index.d.ts; do
              test -f "packages/$pkg/$f" || { echo "missing packages/$pkg/$f"; exit 1; }
            done
          done

  constitution:
    name: Constitutional invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each check below enforces a principle from .specify/memory/constitution.md.
      # They are greps rather than prose because a principle nobody can verify is
      # a principle that decays.

      - name: "V — core imports no node: module"
        run: |
          if grep -rn 'from "node:' packages/core/src packages/react/src; then
            echo "::error::A node: import breaks Edge and Workers compatibility (Principle V)."
            exit 1
          fi

      - name: "V — core has no runtime dependencies"
        run: |
          if node -e 'const p=require("./packages/core/package.json"); process.exit(p.dependencies && Object.keys(p.dependencies).length ? 1 : 0)'; then
            echo "core has no runtime dependencies"
          else
            echo "::error::Principle V: core must have zero runtime dependencies (Zod is a peer)."
            exit 1
          fi

      - name: "IV — no raw-HTML sink anywhere"
        run: |
          # Matches real usage (an assignment or a JSX prop), not the comments that
          # explain why the sink is absent.
          hits=$(grep -rnE 'dangerouslySetInnerHTML[[:space:]]*[:=]|\.innerHTML[[:space:]]*=|insertAdjacentHTML' \
                 packages examples --include='*.ts' --include='*.tsx' \
                 | grep -v '/dist/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Principle IV: model output must never reach a raw-HTML sink."
            exit 1
          fi

      - name: "IV — the depth guard must not be recursive"
        run: |
          # measureTree walks a model-supplied tree. A recursive walk overflows the
          # stack while measuring, i.e. the guard fails before it can fire.
          if ! grep -q 'const stack:' packages/core/src/ui/contract.ts; then
            echo "::error::measureTree must use an explicit stack (Principle IV)."
            exit 1
          fi

      - name: "I — the SDK contacts no host but the configured endpoint"
        run: |
          # Any absolute URL in core outside the sovereignty default is suspicious:
          # the SDK must make no network call the application did not ask for.
          hits=$(grep -rnoE 'https?://[a-zA-Z0-9.-]+' packages/core/src \
                 | grep -vE 'api\.relax\.ai|json-schema\.org|localhost|127\.0\.0\.1' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Principle I: no SDK-initiated egress beyond the configured relaxAI endpoint."
            exit 1
          fi

      - name: "VI — every feature has its Spec Kit chain"
        run: |
          test -f .specify/memory/constitution.md || { echo "::error::missing constitution"; exit 1; }
          for d in specs/*/; do
            for f in spec.md plan.md tasks.md research.md data-model.md; do
              test -f "$d$f" || { echo "::error::$d is missing $f (Principle VI)."; exit 1; }
            done
          done

      - name: "VI — no unresolved clarification markers"
        run: |
          if grep -rn 'NEEDS CLARIFICATION' specs/ --include='*.md' | grep -v 'template\|marker\|Mark every ambiguity\|no markers remain\|rather than guessing'; then
            echo "::error::Principle VI: resolve every [NEEDS CLARIFICATION] before planning."
            exit 1
          fi

  e2e:
    name: Browser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The workspace packages are consumed by the example through `workspace:`
      # links, so the example cannot start until they are built.
      - name: Build packages
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Drives the reference app in a real browser against a local stand-in
      # endpoint: the route's frames reach the hook, the hook's patches reach the
      # renderer, and a failed generation says what failed. No relaxAI account and
      # no model involved — the stand-in makes the document deterministic.
      - name: Browser tests
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: examples/next-app/playwright-report/
          retention-days: 7

  diagrams:
    name: Mermaid diagrams render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Installed OUTSIDE the repository on purpose. `npm` cannot read this
      # workspace's root package.json — it uses pnpm's `workspace:` protocol —
      # and a diagram check has no business touching the project's dependency
      # graph either way.
      - name: Install mermaid-cli (out of tree)
        run: |
          mkdir -p "$RUNNER_TEMP/mermaid-tools"
          cd "$RUNNER_TEMP/mermaid-tools"
          npm init -y >/dev/null
          npm i --no-fund --no-audit @mermaid-js/mermaid-cli@11
          echo "MMDC=$RUNNER_TEMP/mermaid-tools/node_modules/.bin/mmdc" >> "$GITHUB_ENV"

      # A diagram that does not render is worse than no diagram: it looks like
      # documentation and conveys nothing. Two of these were syntactically wrong
      # when first written and looked entirely plausible in the source.
      - name: Render every fenced mermaid block
        run: node scripts/check-diagrams.mjs
